<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricketKing - Live Matches & Session Updates</title>
    <link rel="stylesheet" href="dashboard.style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- TOP HEADER -->
    <header class="top-nav">
        <div class="logo">CRICKET<span>KING</span></div>
        <div class="user-info">
            <a id="headerWaBtn" href="#" target="_blank" class="whatsapp-top-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="dashboard-container">
        
        <!-- PROMO & WHATSAPP BANNER -->
        <section class="banner">
            <div class="banner-text">
                <h2><i class="fa-brands fa-whatsapp"></i> Join Official WhatsApp</h2>
                <p>Instant Live Match Updates & Direct Session Entries!</p>
                <a id="bannerWaBtn" href="#" target="_blank" class="banner-btn">Contact: +92 346 1263524</a>
            </div>
        </section>

        <!-- EXTERNAL PREDICTION SITE CARD -->
        <section class="external-prediction-card">
            <div class="ext-content">
                <div class="ext-title">
                    <i class="fa-solid fa-chart-line"></i> B-T Expert Predictions
                </div>
                <p>Click below to unlock live winner calls & session reports.</p>
            </div>
            <a id="extSiteBtn" href="https://b-t-expret.vercel.app/" target="_blank" class="ext-btn">
                Open Prediction Site <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </section>

        <!-- LIVE MATCHES CONTAINER -->
        <section class="section-title">
            <h3><i class="fa-solid fa-circle-dot live-icon"></i> Live Matches & Sessions</h3>
        </section>

        <div id="matchesList">
            <!-- Matches JSON se auto-load hongay -->
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a id="navExtSite" href="https://b-t-expret.vercel.app/" target="_blank" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Predictions</span>
        </a>
        <a id="navWa" href="#" target="_blank" class="nav-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>
    </nav>

    <!-- JAVASCRIPT FOR JSON FETCHING -->
    <script>
        let configData = null;

        async function loadDashboardData() {
            try {
                const response = await fetch('matches.json');
                configData = await response.json();
                
                // Set WhatsApp links
                const waLink = `https://wa.me/${configData.whatsappNumber}?text=Hello%20CricketKing%20Admin%2C%20mujhe%20Match%20Predictions%20de do`;
                document.getElementById('headerWaBtn').href = waLink;
                document.getElementById('bannerWaBtn').href = waLink;
                document.getElementById('navWa').href = waLink;

                // Set Website links
                document.getElementById('extSiteBtn').href = configData.predictionWebsite;
                document.getElementById('navExtSite').href = configData.predictionWebsite;

                renderMatches();
            } catch (err) {
                console.error("Error loading JSON data:", err);
            }
        }

        function renderMatches() {
            const container = document.getElementById('matchesList');
            container.innerHTML = '';

            configData.matches.forEach(match => {
                const card = document.createElement('div');
                card.className = `match-card ${match.status === 'LIVE' ? 'live-card' : ''}`;
                card.innerHTML = `
                    <div class="match-header">
                        <span class="league">${match.league}</span>
                        <span class="${match.status === 'LIVE' ? 'live-badge' : 'time'}">${match.status === 'LIVE' ? 'LIVE UPDATING' : match.lastUpdated}</span>
                    </div>
                    <div class="teams">
                        <div class="team">
                            <span class="flag">${match.team1.flag}</span>
                            <span class="team-name">${match.team1.name}</span>
                            <span class="score">${match.team1.score}</span>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <span class="flag">${match.team2.flag}</span>
                            <span class="team-name">${match.team2.name}</span>
                            <span class="score">${match.team2.score}</span>
                        </div>
                    </div>

                    <!-- BLURRED PREDICTION BOX -->
                    <div class="prediction-box blur-container">
                        <div class="blurred-content">
                            <div class="pred-item">
                                <span class="pred-label"><i class="fa-solid fa-trophy"></i> Winner Call:</span>
                                <span class="pred-value">PAKISTAN (Non-Favorite Entry)</span>
                            </div>
                            <div class="pred-item">
                                <span class="pred-label"><i class="fa-solid fa-bolt"></i> 6 Overs Session:</span>
                                <span class="pred-value">48-50 YES (PASS)</span>
                            </div>
                            <div class="pred-item">
                                <span class="pred-label"><i class="fa-solid fa-fire"></i> Lambi Session:</span>
                                <span class="pred-value">180-185 NOT</span>
                            </div>
                        </div>

                        <!-- OVERLAY BUTTON TO REDIRECT TO WEBSITE -->
                        <a href="${configData.predictionWebsite}" target="_blank" class="unlock-overlay">
                            <i class="fa-solid fa-lock"></i>
                            <span>Click to Unlock Predictions</span>
                        </a>
                    </div>

                    <div class="match-footer">
                        <span>Updated: ${match.lastUpdated}</span>
                        <a href="${configData.predictionWebsite}" target="_blank" class="bet-btn">View On Website</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>
